<!-- AVANT: lockup horizontal simplificado para fundos escuros (ícone + wordmark). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" fill="none" aria-label="AVANT">
  <defs>
    <linearGradient id="avant-h-icon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3018c8"/>
      <stop offset="100%" stop-color="#180c80"/>
    </linearGradient>
    <linearGradient id="avant-h-bolt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d8ff70"/>
      <stop offset="52%" stop-color="#8fe020"/>
      <stop offset="100%" stop-color="#58b800"/>
    </linearGradient>
    <linearGradient id="avant-h-wm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d8ff70"/>
      <stop offset="48%" stop-color="#8fe020"/>
      <stop offset="100%" stop-color="#c0f040"/>
    </linearGradient>
    <linearGradient id="avant-h-shell" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(143,224,32,0.55)"/>
      <stop offset="100%" stop-color="rgba(48,24,200,0.45)"/>
    </linearGradient>
  </defs>
  <rect width="240" height="64" rx="18" fill="url(#avant-h-shell)"/>
  <rect x="2" y="2" width="236" height="60" rx="16" fill="#0d0d18"/>
  <rect x="16" y="14" width="4" height="36" rx="2" fill="#8fe020"/>
  <rect x="26" y="14" width="36" height="36" rx="9" fill="url(#avant-h-icon)"/>
  <rect x="26" y="14" width="36" height="15" rx="9" fill="#fff" fill-opacity="0.12"/>
  <g transform="translate(31.5 19.5)">
    <svg viewBox="0 0 38 42" width="25" height="28" aria-hidden="true">
      <polygon points="22,0 8,20 15,20 10,42 30,16 18,16" fill="url(#avant-h-bolt)"/>
    </svg>
  </g>
  <text
    x="72"
    y="42"
    fill="url(#avant-h-wm)"
    font-family="Syne, ui-sans-serif, system-ui, sans-serif"
    font-size="22"
    font-weight="900"
    letter-spacing="6"
  >AVANT</text>
</svg>
