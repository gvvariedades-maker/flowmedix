<!-- AVANT: lockup horizontal para fundos escuros (ícone + wordmark premium). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" fill="none" aria-label="AVANT">
  <defs>
    <linearGradient id="avant-h-icon" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="40%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="avant-h-wm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="avant-h-shell" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.25)"/>
      <stop offset="50%" stop-color="rgba(34,197,94,0.60)"/>
      <stop offset="100%" stop-color="rgba(22,163,74,0.40)"/>
    </linearGradient>
  </defs>
  <rect width="240" height="64" rx="18" fill="url(#avant-h-shell)"/>
  <rect x="2" y="2" width="236" height="60" rx="16" fill="#0d0d18"/>
  <rect x="16" y="14" width="4" height="36" rx="2" fill="#22c55e"/>
  <rect x="26" y="14" width="36" height="36" rx="9" fill="url(#avant-h-icon)"/>
  <rect x="26" y="14" width="36" height="6" rx="9" fill="#fff" fill-opacity="0.30"/>
  <text
    x="44"
    y="39"
    text-anchor="middle"
    fill="#ffffff"
    font-family="Plus Jakarta Sans, ui-sans-serif, system-ui, sans-serif"
    font-size="17"
    font-weight="800"
  >A</text>
  <text
    x="72"
    y="42"
    fill="url(#avant-h-wm)"
    font-family="Plus Jakarta Sans, ui-sans-serif, system-ui, sans-serif"
    font-size="22"
    font-weight="800"
    letter-spacing="7"
  >AVANT</text>
</svg>
