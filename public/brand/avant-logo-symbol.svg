<!-- AVANT mark: symbol only, flat vector. Rounded square chip + proprietary bolt for 16px+ legibility. No gradients (use avant-app-icon.svg for gradient). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" aria-label="AVANT">
  <!-- Chip: rx ~22% side (iOS-like), brand purple -->
  <rect width="48" height="48" rx="10.75" fill="#4B1FA8"/>
  <!-- Bolt: single fill, sharp geometry (not emoji curve); gold electric refined -->
  <path fill="#E8B800" d="M24 9.2 32.4 22.9h-6.35l2.05 15.9L15.55 23.55h6.9L24 9.2Z"/>
  <!-- Teal micro-accent: single dot, 1 use (parity with spec) -->
  <circle cx="40" cy="10" r="1.75" fill="#00E5C3"/>
</svg>
