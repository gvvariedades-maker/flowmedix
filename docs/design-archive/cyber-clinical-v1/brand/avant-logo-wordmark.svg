<!-- AVANT: wordmark para fundos escuros — Syne 900, tracking amplo, gradiente verde-limão. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" fill="none" aria-label="AVANT">
  <defs>
    <linearGradient id="avant-wm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d8ff70"/>
      <stop offset="48%" stop-color="#8fe020"/>
      <stop offset="100%" stop-color="#c0f040"/>
    </linearGradient>
  </defs>
  <text
    x="4"
    y="30"
    fill="url(#avant-wm)"
    font-family="Syne, ui-sans-serif, system-ui, sans-serif"
    font-size="26"
    font-weight="900"
    letter-spacing="7"
  >AVANT</text>
</svg>
