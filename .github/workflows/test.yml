name: Testes

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Variáveis alinhadas a lib/env.ts (validateEnv + validateSupabaseUrl) e scripts/validate-env.ts.
# Obrigatórias no build: NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY (URL válida para new URL()).
# Usadas em: npm run build, Playwright webServer (npm run build && npm run start no CI).
env:
  NEXT_PUBLIC_SUPABASE_URL: https://ci-build-placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.ci-build-placeholder-key
  NEXT_PUBLIC_APP_URL: https://ci-build-placeholder.test
  RESEND_API_KEY: re_ci_build_placeholder_key
  RESEND_FROM_EMAIL: Avant <noreply@ci.placeholder.test>
  SUPABASE_WEBHOOK_SECRET: ci_supabase_webhook_secret_placeholder_32
  SUPABASE_SERVICE_ROLE_KEY: ci_service_role_placeholder_key_32chars
  ADMIN_EMAIL: ci-admin@placeholder.test
  METRICS_SECRET: ci_metrics_secret_placeholder
  PERF_BASELINE_ENV: ci

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      ship: ${{ steps.filter.outputs.ship }}
      e2e: ${{ steps.filter.outputs.e2e }}
      perf: ${{ steps.filter.outputs.perf }}
      fsrs_rpc: ${{ steps.filter.outputs.fsrs_rpc }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            # typecheck + check:architecture (ship gates)
            ship:
              - 'app/**'
              - 'components/**'
              - 'lib/**'
              - 'proxy.ts'
              - 'scripts/check-architecture-patterns.ts'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - '.github/workflows/test.yml'
            # Playwright — app/player surfaces + e2e harness
            e2e:
              - 'app/**'
              - 'components/**'
              - 'lib/**'
              - 'e2e/**'
              - 'playwright.config.*'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/test.yml'
            perf:
              - 'lib/cache/**'
              - 'lib/vitrine/**'
              - 'lib/estudar/**'
              - 'components/vitrine/**'
              - 'components/lesson/Questao*'
              - 'components/lesson/EstudarQuestao*'
              - 'components/lesson/useEstudarQuestaoShellState.ts'
              - 'app/**/estudar/**'
              - 'scripts/perf-smoke.ts'
              - 'scripts/capture-perf-baseline.ts'
              - 'docs/perf-smoke-baseline*.json'
            # FSRS RPC integration — local Supabase + Jest (__tests__/lib/fsrs)
            fsrs_rpc:
              - 'lib/fsrs/**'
              - 'supabase/migrations/**'
              - 'supabase/config.toml'
              - '__tests__/lib/fsrs/**'
              - 'scripts/fsrs-mvp-rls-matrix.sql'
              - 'docs/DECISAO_FSRS_R2_DATABASE_TYPES.md'
              - '.github/workflows/test.yml'

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ env.NEXT_PUBLIC_APP_URL }}
          RESEND_API_KEY: ${{ env.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ env.RESEND_FROM_EMAIL }}
          SUPABASE_WEBHOOK_SECRET: ${{ env.SUPABASE_WEBHOOK_SECRET }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
          ADMIN_EMAIL: ${{ env.ADMIN_EMAIL }}

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test

      - name: Upload coverage
        uses: codecov/codecov-action@v6
        continue-on-error: true
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  # Ship gates: always on push; on PR only when app/lib/components/tsconfig change
  typecheck:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.ship == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  architecture-check:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.ship == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Architecture patterns
        run: npm run check:architecture

  # Supply chain — falha só em high/critical (omit=dev). Promover a moderate após clean estável.
  # Scorecard #9 · docs/SECURITY_SCORECARD.md · docs/DEPLOY.md § CI/CD
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: npm audit (high/critical)
        run: npm audit --omit=dev --audit-level=high

  # FSRS RPC integration — Supabase CLI local (Docker) + db reset + Jest com FSRS_RPC_INTEGRATION=1.
  # Não usa secrets remotos; independe de smoke-rls / SMOKE_*.
  # Spec R2 §12.B/§12.C · docs/R2_PERSISTENCIA_FSRS_MVP_CONVERSA.md
  fsrs-rpc-integration:
    needs: changes
    if: needs.changes.outputs.fsrs_rpc == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pin alinhado a package-lock (devDependency supabase)
          version: 2.109.1

      # Histórico completo de migrations não reseta do zero (ex.: campina UPDATE
      # antes de concursos existir no dump). CI FSRS aplica só a migration R2 em
      # stack local limpa — sem db push remoto.
      - name: Disable auto-migrations for FSRS-only local stack
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('supabase/config.toml')
          text = path.read_text(encoding='utf-8')
          needle = '[db.migrations]\n# If disabled, migrations will be skipped during a db push or reset.\nenabled = true'
          repl = '[db.migrations]\n# If disabled, migrations will be skipped during a db push or reset.\nenabled = false'
          if needle not in text:
              raise SystemExit('expected [db.migrations] enabled=true block missing')
          path.write_text(text.replace(needle, repl, 1), encoding='utf-8')
          PY

      - name: Start Supabase local stack
        run: supabase start

      - name: Apply FSRS MVP migration only
        run: |
          eval "$(supabase status -o env)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260728040000_spaced_review_fsrs_mvp.sql

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Export local Supabase credentials
        run: |
          eval "$(supabase status -o env)"
          echo "::add-mask::${ANON_KEY}"
          echo "::add-mask::${SERVICE_ROLE_KEY}"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}"
            echo "SUPABASE_DB_URL=${DB_URL}"
          } >> "$GITHUB_ENV"

      # §13.2 — não versionar types forjados; só assertar presença FSRS no gen --local
      # Decisão: docs/DECISAO_FSRS_R2_DATABASE_TYPES.md
      - name: Assert FSRS symbols in local generated types
        run: |
          npx supabase gen types typescript --local > /tmp/fsrs-db-types.ts
          grep -q spaced_review_cards /tmp/fsrs-db-types.ts
          grep -q spaced_review_logs /tmp/fsrs-db-types.ts
          grep -q fsrs_persist_review /tmp/fsrs-db-types.ts

      # §12.D — matriz RLS via SQL (SET LOCAL ROLE; sem assinar JWT)
      - name: Run FSRS RLS matrix SQL
        run: |
          eval "$(supabase status -o env)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f scripts/fsrs-mvp-rls-matrix.sql

      - name: Run FSRS RPC integration tests
        run: npm test -- __tests__/lib/fsrs
        env:
          FSRS_RPC_INTEGRATION: '1'

  # RLS smoke contra projeto real — só com secrets SMOKE_*; senão skip + aviso (não bloqueia clone).
  # Secrets: SMOKE_SUPABASE_URL, SMOKE_SUPABASE_ANON_KEY, SMOKE_SUPABASE_SERVICE_ROLE_KEY
  # Scorecard #2 · docs/DEPLOY.md § CI secrets
  smoke-rls:
    runs-on: ubuntu-latest
    steps:
      - name: Check smoke secrets
        id: secrets
        env:
          SMOKE_URL: ${{ secrets.SMOKE_SUPABASE_URL }}
          SMOKE_ANON: ${{ secrets.SMOKE_SUPABASE_ANON_KEY }}
          SMOKE_SERVICE: ${{ secrets.SMOKE_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -n "$SMOKE_URL" ] && [ -n "$SMOKE_ANON" ] && [ -n "$SMOKE_SERVICE" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::smoke-rls skipped — configure repository secrets SMOKE_SUPABASE_URL, SMOKE_SUPABASE_ANON_KEY, SMOKE_SUPABASE_SERVICE_ROLE_KEY (see docs/DEPLOY.md § CI secrets)"
          fi

      - name: Checkout
        if: steps.secrets.outputs.configured == 'true'
        uses: actions/checkout@v6

      - name: Setup Node.js
        if: steps.secrets.outputs.configured == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        if: steps.secrets.outputs.configured == 'true'
        run: npm ci

      - name: Run smoke:rls
        if: steps.secrets.outputs.configured == 'true'
        run: npm run smoke:rls
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SMOKE_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SMOKE_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SMOKE_SUPABASE_SERVICE_ROLE_KEY }}

  test-e2e:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:3000
          NEXT_PUBLIC_E2E_DASHBOARD_BYPASS: 'true'
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ env.NEXT_PUBLIC_APP_URL }}
          RESEND_API_KEY: ${{ env.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ env.RESEND_FROM_EMAIL }}
          SUPABASE_WEBHOOK_SECRET: ${{ env.SUPABASE_WEBHOOK_SECRET }}
          # Server-only: AdminLayout pula auth no CI (NODE_ENV=production + CI=true)
          E2E_ADMIN_BYPASS: 'true'
          E2E_DASHBOARD_BYPASS: 'true'
          # Necessário para o teste E2E de cache: next start roda em produção,
          # onde WEBHOOK_SECRET é obrigatório (isValidWebhook retorna false sem ele → 401)
          WEBHOOK_SECRET: 'dev-secret'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  perf-smoke:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.perf == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ env.NEXT_PUBLIC_APP_URL }}
          RESEND_API_KEY: ${{ env.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ env.RESEND_FROM_EMAIL }}
          SUPABASE_WEBHOOK_SECRET: ${{ env.SUPABASE_WEBHOOK_SECRET }}
          METRICS_SECRET: ${{ env.METRICS_SECRET }}

      - name: Generate synthetic 10k dataset
        run: npm run scale:dataset -- --total 10000

      - name: Start app
        run: npm run start > /tmp/next-start.log 2>&1 &
        env:
          NODE_ENV: production
          METRICS_SECRET: ${{ env.METRICS_SECRET }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
          RESEND_API_KEY: ${{ env.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ env.RESEND_FROM_EMAIL }}
          SUPABASE_WEBHOOK_SECRET: ${{ env.SUPABASE_WEBHOOK_SECRET }}

      - name: Wait for app
        run: |
          for i in {1..60}; do
            status=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:3000/api/health" || true)
            if [ "$status" = "200" ] || [ "$status" = "503" ]; then
              exit 0
            fi
            sleep 2
          done
          echo "App did not start in time"
          exit 1

      - name: Run perf smoke
        run: npm run perf:smoke
        env:
          PERF_BASE_URL: http://127.0.0.1:3000
          PERF_DURATION_MS: '20000'
          PERF_CONCURRENCY: '20'
          PERF_BUDGET_BASELINE_FILE: docs/perf-smoke-baseline-${{ env.PERF_BASELINE_ENV }}.json
          PERF_REGRESSION_TOLERANCE: '0.20'
          PERF_REPORT_OUTPUT: artifacts/perf-smoke-report.json
          METRICS_SECRET: ${{ env.METRICS_SECRET }}

      - name: Upload perf artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-smoke-artifacts
          path: |
            artifacts/synthetic-catalog-10k.json
            artifacts/perf-smoke-report.json
            /tmp/next-start.log
          retention-days: 30
