name: Testes

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Variáveis alinhadas a lib/env.ts (validateEnv + validateSupabaseUrl) e scripts/validate-env.ts.
# Obrigatórias no build: NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY (URL válida para new URL()).
# Usadas em: npm run build, Playwright webServer (npm run build && npm run start no CI).
env:
  NEXT_PUBLIC_SUPABASE_URL: https://ci-build-placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.ci-build-placeholder-key
  NEXT_PUBLIC_APP_URL: https://ci-build-placeholder.test
  RESEND_API_KEY: re_ci_build_placeholder_key
  RESEND_FROM_EMAIL: Avant <noreply@ci.placeholder.test>
  SUPABASE_WEBHOOK_SECRET: ci_supabase_webhook_secret_placeholder_32

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ env.NEXT_PUBLIC_APP_URL }}
          RESEND_API_KEY: ${{ env.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ env.RESEND_FROM_EMAIL }}
          SUPABASE_WEBHOOK_SECRET: ${{ env.SUPABASE_WEBHOOK_SECRET }}

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  test-e2e:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ env.NEXT_PUBLIC_APP_URL }}
          RESEND_API_KEY: ${{ env.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ env.RESEND_FROM_EMAIL }}
          SUPABASE_WEBHOOK_SECRET: ${{ env.SUPABASE_WEBHOOK_SECRET }}
          # Server-only: AdminLayout pula auth no CI (NODE_ENV=production + CI=true)
          E2E_ADMIN_BYPASS: 'true'
          # Necessário para o teste E2E de cache: next start roda em produção,
          # onde WEBHOOK_SECRET é obrigatório (isValidWebhook retorna false sem ele → 401)
          WEBHOOK_SECRET: 'dev-secret'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
